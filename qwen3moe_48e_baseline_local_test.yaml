# Run with: automodel qwen3_moe_local_test.yaml --nproc-per-node 1

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 4
  local_batch_size: 2
  ckpt_every_steps: 5
  num_epochs: 1
  max_steps: 10       

dist_env:
  backend: nccl
  timeout_minutes: 1

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: "qwen3_moe_fork/configuration_qwen3_moe.py:Qwen3MoeConfig"
    vocab_size: 50254
    hidden_size: 512
    intermediate_size: 6144
    num_hidden_layers: 12
    num_attention_heads: 8
    num_key_value_heads: 1
    max_position_embeddings: 2048
    tie_word_embeddings: false
    moe_intermediate_size: 352
    num_experts_per_tok: 3
    num_experts: 48
    norm_topk_prob: false
    output_router_logits: true
    router_aux_loss_coef: 0.001
    mlp_only_layers: []
    pad_token_id: 1
    bos_token_id: 0
    eos_token_id: 0

# Dataset — a tiny local slice for now. Real FineWeb-Edu shards come
# later for the HPC run; this just needs *some* tokenized data to prove
# the plumbing works.
dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "data/local_test_shards/*.bin"
  seq_len: 512          # shorter than max_position_embeddings, fine for a quick test
  shuffle_files: true
  align_to_bos: true
  bos_token: 0           # our tokenizer's bos == eos == 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1

distributed:
  strategy: fsdp2
  dp_size: 1           
  tp_size: 1
  cp_size: 1
  sequence_parallel: false